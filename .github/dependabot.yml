# Dependabot — automated dependency PRs. Monthly + grouped to keep noise low
# on a single-maintainer project.
#
# Python rides the `uv` ecosystem, which reads pyproject.toml + uv.lock
# directly. (This file previously omitted Python because Dependabot couldn't
# update uv.lock; that stopped being true when uv version updates went GA on
# 2025-03-13. Left unmanaged, the locks simply rot — a hatchling release aged
# requirements-build.lock into a red CI on every open PR, see #228.)
#
# Two Python files Dependabot will NOT keep in step, both still manual:
#
#   * requirements-prod.lock — `uv export`ed from uv.lock, and CI diffs it
#     (ci.yml "requirements-prod.lock drift check"). Dependabot rewrites
#     uv.lock but not this export, so a grouped PR that bumps any *runtime*
#     dep lands red. Fix in one command on the PR branch:
#         uv export --no-dev --no-emit-project --format requirements-txt \
#             > requirements-prod.lock
#     Dev-only bumps (ruff, mypy, pytest…) don't touch it. Grouped + monthly
#     means this is at most one export a month, not one per bump.
#
#     Don't leave a red export sitting: pip-audit (ci.yml) audits
#     requirements-prod.lock, NOT uv.lock, so until the export is regenerated
#     a security bump to a runtime dep is not actually being audited — the
#     audit still reads the old pins. That, more than the red X, is the reason
#     to regenerate promptly. The bump also leaves *transitive* runtime deps
#     where they were: #242 bumped pyjwt but not cryptography (pulled in via
#     pyjwt[crypto]), and advisories kept landing while the PR sat open. So
#     run pip-audit on the regenerated export, and `uv lock --upgrade-package
#     <name>` anything it flags.
#
#     Automating the export (checked against GitHub's docs, 2026-10-20):
#     Dependabot-triggered workflows get a read-only GITHUB_TOKEN by default,
#     but the workflow's `permissions:` key can raise it to contents: write.
#     Pushing the export back therefore needs neither pull_request_target nor a
#     PAT. Two costs remain. A GITHUB_TOKEN push to a PR only creates CI runs
#     that wait for "Approve and run" (workflow_dispatch is the exception).
#     And the job would run third-party actions with a write token on an
#     auto-generated branch. Not automated yet; it is a deliberate decision.
#
#   * requirements-build.lock — `uv pip compile`d from [build-system].requires.
#     That list pins hatchling AND its whole resolved closure with `==` (see
#     the pyproject comment): pinning hatchling alone still drifted whenever
#     one of its own dependencies released. The uv ecosystem does bump these
#     pins (#242 moved hatchling), so a bump PR needs this lock recompiled
#     too. If a new hatchling pulls in a new dependency,
#     tests/test_dependency_pins.py fails until it is pinned as well.
#
# Tool versions: CI's ruff lint job installs the ruff version uv.lock pins, so
# a ruff bump here moves CI with it. .pre-commit-config.yaml pins its own ruff
# and mypy revs. tests/test_dependency_pins.py fails when they differ from
# uv.lock, so a bump PR touching ruff or mypy also bumps those two `rev:` lines.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
    groups:
      composer:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3
